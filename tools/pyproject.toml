[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyphyextools"
authors = [
    {name = "Quentin Rodier", email = "quentin.rodier@meteo.fr"},
    {name = "Sébastien Riette", email = "sebastien.riette@meteo.Fr"},
]
dynamic = ["version"]
description = "PHYEX tools package"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = [
    "netCDF4<=1.7.2", # line to be removed completely when belenos is updated
    "matplotlib",
    # pyfortool version must be kept in sync with src/phyex/cmake/phyex_pyfortool.cmake
    # and with the build requirements of the top-level pyproject.toml
    "pyfortool>=0.2.25",
    "numpy",
    "pandas<=2.3.2", # version constraint to be removed when belenos is updated
    "xarray",
    "epygram",
    "ctypesForFortran>=1.3.0,!=2.0.*,!=2.1.*",
    "fypp",
    "ecbundle @ git+https://github.com/ecmwf/ecbundle",
    "ial_build>=1.4.8",
]

[project.urls]
Homepage = "https://github.com/UMR-CNRM/PHYEX"

[project.scripts]
"phyex-prep_code" = "pyphyextools.prep_code:main"
"phyex-plot_perf" = "pyphyextools.plot_perf:main"
"phyex-check_norms" = "pyphyextools.testing.coding_norms:main"
"phyex-compare" = "pyphyextools.testing.compare:main"
"phyex-check_ial" = "pyphyextools.testing.check_ial:main"
"phyex-check_mesonh" = "pyphyextools.testing.check_mesonh:main"
"phyex-check_lmdz" = "pyphyextools.testing.check_lmdz:main"
"phyex-check_testprogs" = "pyphyextools.testing.check_testprogs:main"
"phyex-check_consistency" = "pyphyextools.testing.check_consistency:main"
"phyex-check_commit" = "pyphyextools.testing.check_commit:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# PHYEX version, read from src/phyex/VERSION by pyphyextools/__init__.py
version = {attr = "pyphyextools.__version__"}

