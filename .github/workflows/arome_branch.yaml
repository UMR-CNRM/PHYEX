name: Build the AROME branch from commits

on:
  push:
    branches:
      - master

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Make the arome branch available
      run: git branch --track arome origin/arome || { echo "AROME branch does not exist. Stopping the job."; exit; }

    - name: Process commits
      run: |
        if git show-ref --verify --quiet refs/heads/arome; then
          # Python environment and dependencies
          python3 -m venv phyex.env
          . phyex.env/bin/activate
          pip install --prefer-binary -e ${{ github.workspace }}/tools/
          # Loop on all new commits from the oldest to the newest, restricted to the immediate family
          status=0
          for commit in $(git rev-list --reverse --topo-order --ancestry-path ${{ github.event.before}}..${{ github.sha}}); do
            temp_dir=$(mktemp -d)
            # Each commit is processed in a subshell; on failure the transformation is
            # discarded (nothing is committed/pushed) and we continue with the next commit.
            # Explicit '|| exit 1' because 'set -e' is inactive inside a tested subshell.
            set +e
            (
              cd $temp_dir || exit 1
              # Get the arome branch in a new repo
              git init --initial-branch=master || exit 1
              git config --global user.name "GitHub Actions"
              git config --global user.email "actions@github.com"
              git remote add origin ${{ github.workspace }}/.git || exit 1
              git fetch origin || exit 1
              git checkout -b arome origin/arome || exit 1
              # Merge (only for history) the new commit and erase the content
              git merge --no-commit --no-ff $commit || true
              find . -not -path './.git/*' -not -path './.git' -delete || exit 1
              # Copy the new commit src directory and transform it using prep_code
              cp -r ${{ github.workspace }}/src . || exit 1
              phyex-prep_code -s gmkpack_ignored_files -s turb -s micro -s aux -s conv -s ial_version.json -s CMakeLists.txt -s VERSION -s cmake -m arome $temp_dir -- --shugradTransfo --removeACC --mnhExpand || exit 1
              # Commit and push to the main repo
              git add . || exit 1
              git commit -m "AROME version of commit $commit" -m "$cmd" || exit 1
              git push origin arome || exit 1
            )
            status=$?
            set -e
            if [ $status -ne 0 ]; then
              echo "::warning::Transformation of commit $commit failed (status $status), commit discarded"
            fi
            cd ${{ github.workspace }}
            rm -rf $temp_dir
          done
          # Push the new commits on the arome branch
          cd ${{ github.workspace }}
          git push -u origin arome
          # The final status is the status of the most recent commit
          exit $status
        fi
