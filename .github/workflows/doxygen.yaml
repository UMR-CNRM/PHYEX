name: Doxygen
run-name: Updating online doc
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Install Doxygen
        run: sudo apt-get install doxygen graphviz -y
        shell: bash

      - name: Generate Doxygen Documentation
        # PROJECT_NUMBER: PHYEX version (src/phyex/VERSION)
        run: |
          cd docs/doxygen; rm .gitignore
          (cat doxygen_config; echo "PROJECT_NUMBER = $(cat ../../src/phyex/VERSION)") | doxygen -
        shell: bash

      - name: Create .nojekyll (ensures pages with underscores work on gh pages)
        run: touch docs/doxygen/html/.nojekyll
        shell: bash

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs

