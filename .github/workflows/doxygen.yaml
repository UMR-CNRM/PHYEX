name: Doxygen
run-name: Updating online doc
on:
  push:
    branches:
      - master
jobs:
  pages:
    # Are the GitHub Pages activated? The documentation is not generated otherwise (for
    # instance in forks)
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check if the GitHub Pages are activated
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1); then
            enabled=true
          elif echo "${out}" | grep -q 'HTTP 404'; then
            echo "The GitHub Pages are not activated, the documentation is not deployed"
            enabled=false
          else
            echo "${out}"
            exit 1
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
        shell: bash

  deploy:
    needs: pages
    if: needs.pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Install Doxygen
        run: sudo apt-get install doxygen graphviz -y
        shell: bash

      - name: Generate Doxygen Documentation
        # PROJECT_NUMBER: PHYEX version (src/phyex/VERSION)
        run: |
          cd docs/doxygen; rm .gitignore
          (cat doxygen_config; echo "PROJECT_NUMBER = $(cat ../../src/phyex/VERSION)") | doxygen -
        shell: bash

      - name: Create .nojekyll (ensures pages with underscores work on gh pages)
        run: touch docs/doxygen/html/.nojekyll
        shell: bash

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs

