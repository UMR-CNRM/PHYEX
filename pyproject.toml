#-----------------------------------------------------------------------
# PHYEX python wheel
#
# The wheel is built by scikit-build-core which drives the top-level
# CMakeLists.txt (with ENABLE_PYTHON_WHEEL=ON). The wheel contains the
# pyphyex package:
#   - the python modules of src/pyphyex (among them the phyex1d 1D model)
#   - the 'pyphyex' install component of the CMake build: the low-level
#     module pyphyex.lowlevel (generated python binding), the version
#     (pyphyex/_version.py) and the shared libraries.
#
# Usage example:
#   pip wheel . -w dist
#   pip install .
# CMake options (e.g. toolchain file) can be given with:
#   pip wheel . -C cmake.define.CMAKE_TOOLCHAIN_FILE=<arch>.ecbuild
# or with the CMAKE_ARGS environment variable.
#-----------------------------------------------------------------------

[build-system]
# pyfortool generates the python binding; installed by pip in the build
# environment, it is found by CMake which does not install it again.
# The pyfortool minimal version must be kept in sync with
# src/phyex/cmake/phyex_pyfortool.cmake and tools/pyproject.toml
requires = ["scikit-build-core>=0.10", "pyfortool>=0.2.25"]
build-backend = "scikit_build_core.build"

[project]
name = "pyphyex"
dynamic = ["version"]
description = "Python binding of the PHYEX atmospheric physics package and 1D model (phyex1d)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Quentin Rodier", email = "quentin.rodier@meteo.fr"},
    {name = "Sébastien Riette", email = "sebastien.riette@meteo.fr"},
]
dependencies = [
    "numpy",
    "ctypesForFortran>=1.3.0,!=2.0.*,!=2.1.*",
    # phyex1d
    "pppy",
    "scipy",
    "netCDF4",
    "f90nml",
    "ephem",
    "xarray",
]

[project.scripts]
phyex1d-exp_run = "pyphyex.phyex1d.cli:main_run"
phyex1d-exp_plot = "pyphyex.phyex1d.cli:main_plot"
phyex1d-exp_list = "pyphyex.phyex1d.cli:main_list"
phyex1d-cases_install = "pyphyex.phyex1d.case:main_cases_install"
phyex1d-cases_list = "pyphyex.phyex1d.case:main_cases_list"

[project.urls]
Homepage = "https://github.com/UMR-CNRM/PHYEX"
Documentation = "https://github.com/UMR-CNRM/PHYEX/blob/master/docs/PHYEX.md"
"Code documentation" = "https://umr-cnrm.github.io/PHYEX/"
Repository = "https://github.com/UMR-CNRM/PHYEX.git"
Issues = "https://github.com/UMR-CNRM/PHYEX/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
# The python package (src/pyphyex) is completed by the 'pyphyex' component of
# the CMake build (only this component is installed)
wheel.packages = ["src/pyphyex"]
install.components = ["pyphyex"]
# The libraries are loaded with ctypes (no python C-API): the wheel does not
# depend on the python version, only on the platform
wheel.py-api = "py3"
# The sdist only needs what is necessary to build the wheel (.gitignore'd files
# are already excluded, but untracked files are not)
sdist.exclude = [
    "/tools/conf_tests",   # test cases data (with symlinks, >2GB when archived)
    "/clone_and_test.sh",
    "/docs",
    "/.github",
]

[tool.scikit-build.cmake.define]
ENABLE_PYTHON_WHEEL = "ON"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/phyex/VERSION"
regex = '(?P<value>[0-9]+(?:\.[0-9]+)*)'
