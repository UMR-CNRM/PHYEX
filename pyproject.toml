#-----------------------------------------------------------------------
# PHYEX python wheel
#
# The wheel is built by scikit-build-core which drives the top-level
# CMakeLists.txt (with ENABLE_PYTHON_WHEEL=ON). Only the 'pyphyex' install
# component is put in the wheel: the pyphyex python module (generated
# python binding) and the shared libraries it needs.
#
# Usage example:
#   pip wheel . -w dist
#   pip install .
# CMake options (e.g. toolchain file) can be given with:
#   pip wheel . -C cmake.define.CMAKE_TOOLCHAIN_FILE=<arch>.ecbuild
# or with the CMAKE_ARGS environment variable.
#-----------------------------------------------------------------------

[build-system]
# pyfortool generates the python binding; installed by pip in the build
# environment, it is found by CMake which does not install it again.
# The pyfortool minimal version must be kept in sync with
# src/phyex/cmake/phyex_pyfortool.cmake and tools/pyproject.toml
requires = ["scikit-build-core>=0.10", "pyfortool>=0.2.25"]
build-backend = "scikit_build_core.build"

[project]
name = "pyphyex"
dynamic = ["version"]
description = "Python binding of the PHYEX atmospheric physics package"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Quentin Rodier", email = "quentin.rodier@meteo.fr"},
    {name = "Sébastien Riette", email = "sebastien.riette@meteo.fr"},
]
dependencies = [
    "numpy",
    "ctypesForFortran>=1.3.0,!=2.0.*,!=2.1.*",
]

[project.urls]
Homepage = "https://github.com/UMR-CNRM/PHYEX"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
# The python module is generated by the CMake build: no python package is
# taken from the source tree, and only the 'pyphyex' component is installed
wheel.packages = []
install.components = ["pyphyex"]
# The libraries are loaded with ctypes (no python C-API): the wheel does not
# depend on the python version, only on the platform
wheel.py-api = "py3"
# The sdist only needs what is necessary to build the wheel (.gitignore'd files
# are already excluded, but untracked files are not)
sdist.exclude = [
    "/tools/conf_tests",   # test cases data (with symlinks, >2GB when archived)
    "/tools/testing.sh",
    "/clone_and_test.sh",
    "/docs",
    "/.github",
    "/build",              # old compilation scripts
]

[tool.scikit-build.cmake.define]
ENABLE_PYTHON_WHEEL = "ON"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/phyex/VERSION"
regex = '(?P<value>[0-9]+(?:\.[0-9]+)*)'
